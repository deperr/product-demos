---
- name: Back up all Containerlab device configurations for Gitea
  hosts: "{{ _hosts | default('containerlab') }}"
  gather_facts: false
  roles:
    - role: demo.network.backup

- name: Publish device configurations to Gitea
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Publish device configurations from the backup role
      ansible.builtin.include_role:
        name: demo.network.backup
        tasks_from: publish_gitea
