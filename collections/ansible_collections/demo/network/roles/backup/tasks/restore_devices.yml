---
- name: Require explicit restore confirmation
  run_once: true
  delegate_to: localhost
  ansible.builtin.assert:
    that:
      - backup_restore_confirmation == 'RESTORE'
    fail_msg: >-
      Restore is destructive. Set backup_restore_confirmation to RESTORE in the
      launch survey before retrying.

- name: Require a Gitea backup branch name
  run_once: true
  delegate_to: localhost
  ansible.builtin.assert:
    that:
      - backup_restore_branch | length > 0
      - backup_restore_branch is match('^network-backup-[0-9]{12}$')
    fail_msg: >-
      Provide a backup branch in network-backup-YYYYMMDDHHMM format.

- name: Require the Gitea credential injected by Provision Gitea
  run_once: true
  delegate_to: localhost
  ansible.builtin.assert:
    that:
      - gitea_host | default('') | length > 0
      - gitea_host | default('') != 'REPLACEME'
      - gitea_token | default('') | length > 0
      - gitea_token | default('') not in ['REPLACEME', 'replace_me']
    fail_msg: >-
      Attach the Gitea Controller credential created by Infrastructure | AWS -
      Provision Gitea before restoring a backup.

- name: Check that the requested Gitea backup branch exists
  run_once: true
  delegate_to: localhost
  register: backup_restore_branch_result
  failed_when: false
  no_log: true
  ansible.builtin.uri:
    url: >-
      {{ backup_gitea_api_base }}/repos/{{ backup_gitea_owner }}/{{ backup_gitea_repo }}/branches/{{ backup_restore_branch | urlencode }}
    method: GET
    headers:
      Authorization: "token {{ gitea_token }}"
    status_code: [200]
    validate_certs: false

- name: Assert the requested Gitea backup branch exists
  run_once: true
  delegate_to: localhost
  ansible.builtin.assert:
    that:
      - backup_restore_branch_result.status | default(0) | int == 200
    fail_msg: >-
      Gitea branch {{ backup_restore_branch }} was not found in
      {{ backup_gitea_owner }}/{{ backup_gitea_repo }}. Choose an existing
      network-backup-YYYYMMDDHHMM branch and retry.

- name: Retrieve the backup manifest from Gitea
  run_once: true
  delegate_to: localhost
  register: backup_restore_manifest_response
  failed_when: false
  no_log: true
  ansible.builtin.uri:
    url: >-
      {{ backup_gitea_api_base }}/repos/{{ backup_gitea_owner }}/{{ backup_gitea_repo }}/contents/manifest.yml?ref={{ backup_restore_branch | urlencode }}
    method: GET
    headers:
      Authorization: "token {{ gitea_token }}"
    status_code: [200]
    validate_certs: false

- name: Require a manifest for the selected backup
  run_once: true
  ansible.builtin.assert:
    that:
      - backup_restore_manifest_response.status | default(0) | int == 200
      - backup_restore_manifest_response.json.content | default('') | length > 0
    fail_msg: >-
      Could not read manifest.yml on {{ backup_restore_branch }}
      (HTTP {{ backup_restore_manifest_response.status | default('no response') }}).
      Select a completed backup branch that contains a manifest.

- name: Parse and verify the backup manifest
  run_once: true
  block:
    - name: Parse manifest metadata
      no_log: true
      ansible.builtin.set_fact:
        backup_restore_manifest: "{{ backup_restore_manifest_response.json.content | b64decode | from_yaml }}"

    - name: Validate manifest identity and device list
      ansible.builtin.assert:
        that:
          - backup_restore_manifest is mapping
          - backup_restore_manifest.backup is defined and backup_restore_manifest.backup is mapping
          - backup_restore_manifest.backup.branch | default('') == backup_restore_branch
          - backup_restore_manifest.backup.repository | default('') == backup_gitea_owner ~ '/' ~ backup_gitea_repo
          - backup_restore_manifest.devices is defined and (backup_restore_manifest.devices | type_debug) == 'list'
          - backup_restore_manifest.devices | length > 0
  rescue:
    - name: Report an invalid backup manifest
      ansible.builtin.fail:
        msg: "manifest.yml is malformed or does not describe {{ backup_restore_branch }} in this repository."

- name: Require a supported restore platform
  ansible.builtin.assert:
    that:
      - ansible_network_os | default('') in backup_gitea_os_directories
    fail_msg: "No backup directory is configured for {{ inventory_hostname }}."

- name: Find this device's entry in the manifest
  ansible.builtin.set_fact:
    backup_restore_manifest_entries: >-
      {{ backup_restore_manifest.devices | selectattr('name', 'defined')
         | selectattr('name', 'equalto', inventory_hostname) | list }}
    backup_restore_expected_os: "{{ backup_gitea_os_directories[ansible_network_os] }}"

- name: Validate this device's manifest entry
  ansible.builtin.assert:
    that:
      - backup_restore_manifest_entries | length == 1
      - backup_restore_manifest_entries[0].os | default('') == backup_restore_expected_os
      - backup_restore_manifest_entries[0].path | default('') == backup_restore_expected_os ~ '/' ~ inventory_hostname ~ '.cfg'
      - backup_restore_manifest_entries[0].sha256 | default('') is match('^[a-f0-9]{64}$')
    fail_msg: "Manifest entry for {{ inventory_hostname }} is missing, duplicated, or invalid."

- name: Create the local restore staging directory
  run_once: true
  delegate_to: localhost
  ansible.builtin.file:
    path: "{{ backup_restore_dir }}/{{ backup_restore_branch }}"
    state: directory
    mode: "0700"

- name: Retrieve this device configuration from Gitea
  delegate_to: localhost
  register: backup_restore_file
  no_log: true
  ansible.builtin.uri:
    url: >-
      {{ backup_gitea_api_base }}/repos/{{ backup_gitea_owner }}/{{ backup_gitea_repo }}/contents/{{ backup_gitea_os_directories[ansible_network_os] }}/{{ inventory_hostname }}.cfg?ref={{ backup_restore_branch | urlencode }}
    method: GET
    headers:
      Authorization: "token {{ gitea_token }}"
    status_code: [200]
    validate_certs: false

- name: Stage this device configuration for restore
  delegate_to: localhost
  no_log: true
  ansible.builtin.copy:
    content: "{{ backup_restore_file.json.content | b64decode }}"
    dest: "{{ backup_restore_dir }}/{{ backup_restore_branch }}/{{ inventory_hostname }}.cfg"
    mode: "0600"

- name: Calculate the staged configuration checksum
  delegate_to: localhost
  register: backup_restore_staged_file
  ansible.builtin.stat:
    path: "{{ backup_restore_dir }}/{{ backup_restore_branch }}/{{ inventory_hostname }}.cfg"
    checksum_algorithm: sha256
    get_attributes: false
    get_mime: false

- name: Verify the staged configuration matches the manifest
  ansible.builtin.assert:
    that:
      - backup_restore_staged_file.stat.checksum | default('') == backup_restore_manifest_entries[0].sha256
    fail_msg: "SHA-256 mismatch for {{ inventory_hostname }} on {{ backup_restore_branch }}."

- name: Restore IOS configuration from the selected backup
  when: ansible_network_os == 'cisco.ios.ios'
  cisco.ios.ios_config:
    src: "{{ backup_restore_dir }}/{{ backup_restore_branch }}/{{ inventory_hostname }}.cfg"

- name: Restore Junos configuration from the selected backup
  when: ansible_network_os == 'juniper.device.junos'
  juniper.device.junos_config:
    src: "{{ backup_restore_dir }}/{{ backup_restore_branch }}/{{ inventory_hostname }}.cfg"
    src_format: set
    update: merge

- name: Restore EOS configuration from the selected backup
  when: ansible_network_os == 'arista.eos.eos'
  arista.eos.eos_config:
    src: "{{ backup_restore_dir }}/{{ backup_restore_branch }}/{{ inventory_hostname }}.cfg"
